# ─── Server & Performance Compression (Supports AWS Elastic Beanstalk & Custom Ports) ──────
server.port=${PORT:5000}
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
server.compression.min-response-size=1024

# ─── Datasource & HikariCP Pool (All secrets from environment variables) ───────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# ─── JPA / Hibernate Performance ─────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.hbm2ddl.auto=none
spring.jpa.properties.jakarta.persistence.schema-generation.database.action=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=dbo
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ─── Security / JWT & CORS ───────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:shinex_hris_super_secret_jwt_key_2026_at_least_32_bytes_long}
jwt.expiration-ms=86400000
cors.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,https://hris.process361.com,https://d39kzetifrtq7d.cloudfront.net}

# ─── Schema Migration Flag (Default: false) ──────────────────────────────────
app.schema.migrate=${APP_SCHEMA_MIGRATE:false}

# ─── EPF / ETF Rates ─────────────────────────────────────────────────────────
hsb.epf.employee-percent=8
hsb.epf.company-percent=12
hsb.etf.percent=3
