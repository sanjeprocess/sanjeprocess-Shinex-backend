# ─── Server ──────────────────────────────────────────────────────────────────
server.port=${SERVER_PORT:8080}

# ─── Datasource ──────────────────────────────────────────────────────────────
# In production (Railway): set SPRING_DATASOURCE_URL / USERNAME / PASSWORD as env vars
# Locally: falls back to the values after the colon (:)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=Shinex;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Tharindu123@}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ─── JPA / Hibernate ─────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_schema=dbo

# ─── Security / JWT ──────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:change-this-to-a-long-random-string-min-32-chars}
jwt.expiration-ms=86400000

# ─── EPF / ETF Rates ─────────────────────────────────────────────────────────
hsb.epf.employee-percent=8
hsb.epf.company-percent=12
hsb.etf.percent=3
