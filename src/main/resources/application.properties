# ─── Server & Performance Compression (Supports AWS Elastic Beanstalk & Custom Ports) ──────
server.port=${PORT:${SERVER_PORT:5000}}
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
server.compression.min-response-size=1024

# ─── Datasource & HikariCP Pool Optimization ────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=Shinex;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Tharindu123@}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# ─── JPA / Hibernate Performance ─────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=dbo
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ─── Security / JWT ──────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:change-this-to-a-long-random-string-min-32-chars}
jwt.expiration-ms=86400000

# ─── EPF / ETF Rates ─────────────────────────────────────────────────────────
hsb.epf.employee-percent=8
hsb.epf.company-percent=12
hsb.etf.percent=3
