# Option A: Windows Authentication (Integrated Security - Matches your SSMS environment)
spring.datasource.url=jdbc:sqlserver://localhost;instanceName=SQLEXPRESS;databaseName=Shinex;integratedSecurity=true;encrypt=true;trustServerCertificate=true
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Option B: SQL Server Authentication (Fallback - uncomment and configure if needed)
# spring.datasource.url=jdbc:sqlserver://localhost;instanceName=SQLEXPRESS;databaseName=Shinex;encrypt=true;trustServerCertificate=true
# spring.datasource.username=sa
# spring.datasource.password=YOUR_PASSWORD
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
server.port=8080

# JWT
jwt.secret=change-this-to-a-long-random-string-min-32-chars
jwt.expiration-ms=86400000

# EPF/ETF defaults (configurable)
hsb.epf.employee-percent=8
hsb.epf.company-percent=12
hsb.etf.percent=3

